<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voltage</title>
<!-- An empty data icon. Without it the browser asks the server for a favicon,
     and this page must ask nothing of any server. -->
<link rel="icon" href="data:,">
<style>
/* ---------------------------------------------------------------------------
   Voltage. One file: this style, the markup below it, and one script.
   No font, no image and no script comes from a server.
   --------------------------------------------------------------------------- */

:root {
  color-scheme: dark;
  --panel: #2b2b2e;
  --panel-hi: #3a3a3e;
  --panel-lo: #201f22;
  --ink: #e9e6df;
  --ink-dim: #9a968d;
  --line: #17171a;
  --accent: #ff8a3d;
  --accent-dim: #7a4523;
  --green: #7fd18b;
  --screw: #6a6a70;
  --font: "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #101012;
  color: var(--ink);
  font-family: var(--font);
  -webkit-user-select: none;
  user-select: none;
}

#shell {
  max-width: 1264px;
  margin: 0 auto;
  padding: 10px 12px 16px;
}

/* --- brand strip --------------------------------------------------------- */

#brand {
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding: 6px 14px 10px;
}

#brand .logo {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.34em;
  color: var(--ink);
  text-shadow: 0 1px 0 #000, 0 0 18px rgba(255, 138, 61, 0.25);
}

#brand .sub {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

#brand .spacer { flex: 1; }

#status {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--ink-dim);
}

#status.live { color: var(--green); }

/* --- the preset bar ------------------------------------------------------- */

#presets {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 14px 9px;
  flex-wrap: wrap;
}

.pr-label {
  font-size: 9px;
  letter-spacing: 0.19em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

#presets select,
#presets input[type="text"],
#presets button {
  height: 25px;
  border-radius: 4px;
  border: 1px solid #141417;
  background: linear-gradient(180deg, #33333a, #202024);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 11px;
  padding: 0 7px;
  cursor: pointer;
}

#presets select { min-width: 150px; color: var(--accent); }
#presets input[type="text"] { width: 118px; cursor: text; }
#presets input[type="text"]::placeholder { color: #6d6a64; }
#presets button:hover { background: linear-gradient(180deg, #3d3d45, #26262b); }
#presets button:active { background: linear-gradient(180deg, #202024, #33333a); }

#presets select:focus-visible,
#presets input:focus-visible,
#presets button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

#preset-msg {
  font-size: 11px;
  color: var(--accent);
  margin-left: 4px;
}

/* --- the panel ----------------------------------------------------------- */

#panel {
  position: relative;
  border-radius: 8px;
  padding: 14px;
  background:
    linear-gradient(180deg, var(--panel-hi) 0%, var(--panel) 42%, var(--panel-lo) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.07),
    inset 0 -1px 0 rgba(0, 0, 0, 0.6),
    0 10px 26px rgba(0, 0, 0, 0.55);
  border: 1px solid var(--line);
  min-height: 120px;
}

/* The four screws of the front plate. They are CSS, not an image. */
#panel::before, #panel::after {
  content: "";
  position: absolute;
  top: 7px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #8d8d93, var(--screw) 60%, #3a3a3f);
  box-shadow: inset 0 0 2px #000, 0 1px 0 rgba(255, 255, 255, 0.08);
}
#panel::before { left: 7px; }
#panel::after { right: 7px; }

#keyboard {
  margin-top: 12px;
  min-height: 40px;
}

/* --- sections and controls ------------------------------------------------ */

#panel-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: flex-start;
}

.sec {
  flex: 0 1 auto;
  border: 1px solid rgba(0, 0, 0, 0.55);
  border-radius: 5px;
  padding: 6px 9px 8px;
  margin: 0;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(0, 0, 0, 0.12));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
}

.sec > legend {
  font-size: 9px;
  letter-spacing: 0.19em;
  text-transform: uppercase;
  color: var(--accent);
  padding: 0 5px;
  opacity: 0.9;
}

.sec-body {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 6px;
  max-width: 424px;
}

.ctrl {
  width: 62px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.ctrl-label {
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-dim);
  text-align: center;
  white-space: nowrap;
}

.ctrl-value {
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--ink);
  opacity: 0.85;
  white-space: nowrap;
}

.knob {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  position: relative;
  background: radial-gradient(circle at 50% 32%, #5a5a63, #2d2d33 68%, #1d1d21);
  border: 1px solid #141417;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.09);
  cursor: ns-resize;
  touch-action: none;
}

.knob:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.knob-ind {
  position: absolute;
  left: 50%;
  top: 4px;
  width: 2px;
  height: 14px;
  margin-left: -1px;
  border-radius: 1px;
  background: var(--accent);
  box-shadow: 0 0 6px rgba(255, 138, 61, 0.75);
  transform-origin: 50% 17px;
}

.switch {
  width: 42px;
  height: 42px;
  border-radius: 4px;
  border: 1px solid #141417;
  background: linear-gradient(180deg, #33333a, #202024);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 2px 5px rgba(0, 0, 0, 0.5);
  cursor: pointer;
  position: relative;
  padding: 0;
  color: var(--ink-dim);
  font: inherit;
  font-size: 9px;
  letter-spacing: 0.1em;
}

.switch::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 7px;
  margin-left: -5px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #1a1a1d;
  box-shadow: inset 0 0 3px #000;
}

.switch[aria-checked="true"] { color: var(--ink); }
.switch[aria-checked="true"]::after {
  background: var(--accent);
  box-shadow: 0 0 9px rgba(255, 138, 61, 0.9);
}

.switch-text { position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; }
.switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.sel {
  width: 58px;
  height: 42px;
  border-radius: 4px;
  border: 1px solid #141417;
  background: linear-gradient(180deg, #33333a, #1e1e22);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  color: var(--accent);
  font-family: var(--mono);
  font-size: 11px;
  text-align: center;
  padding: 0 2px;
  cursor: pointer;
}

.sel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* --- the keyboard --------------------------------------------------------- */

.kb {
  display: flex;
  gap: 10px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: linear-gradient(180deg, var(--panel-lo), #17171a);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
}

.kb-side {
  width: 74px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.kb-side .row { display: flex; gap: 5px; }

.oct-btn {
  width: 28px;
  height: 26px;
  border-radius: 4px;
  border: 1px solid #141417;
  background: linear-gradient(180deg, #34343b, #202024);
  color: var(--ink);
  font: inherit;
  font-size: 14px;
  line-height: 1;
  cursor: pointer;
}

.oct-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.oct-btn:active { background: linear-gradient(180deg, #202024, #34343b); }

.oct-label {
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

.oct-read {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent);
}

.kb-keys {
  position: relative;
  flex: 1;
  height: 126px;
  touch-action: none;
}

.key {
  position: absolute;
  top: 0;
  box-sizing: border-box;
  border: 1px solid #202024;
  cursor: pointer;
}

.key.white {
  height: 100%;
  background: linear-gradient(180deg, #f4f1ea 0%, #ded9d0 88%, #c9c4bb 100%);
  border-radius: 0 0 4px 4px;
  box-shadow: inset 0 -3px 5px rgba(0, 0, 0, 0.18);
}

.key.black {
  height: 63%;
  z-index: 2;
  background: linear-gradient(180deg, #34343a 0%, #17171b 85%, #0d0d10 100%);
  border-color: #0a0a0c;
  border-radius: 0 0 3px 3px;
  box-shadow: 0 3px 5px rgba(0, 0, 0, 0.6);
}

.key.white.on {
  background: linear-gradient(180deg, #ffd0ab 0%, #ff9d51 100%);
  box-shadow: inset 0 -3px 6px rgba(140, 60, 10, 0.35);
}

.key.black.on {
  background: linear-gradient(180deg, #c2641f 0%, #7d3b0f 100%);
}

/* --- the start plate ----------------------------------------------------- */

#start-plate {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(8, 8, 10, 0.86);
  backdrop-filter: blur(2px);
  cursor: pointer;
  transition: opacity 0.3s ease;
}

#start-plate[hidden] { display: none; }
#start-plate.off { opacity: 0; pointer-events: none; }

#start-plate .plate-inner {
  text-align: center;
  padding: 34px 44px;
  border-radius: 10px;
  border: 1px solid #3a3a40;
  background: linear-gradient(180deg, #2c2c30, #1b1b1e);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
}

#start-plate .plate-title {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 0.4em;
  margin-bottom: 14px;
  text-shadow: 0 0 22px rgba(255, 138, 61, 0.45);
}

#start-plate .plate-text {
  font-size: 14px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
}

#start-plate .plate-note {
  margin-top: 16px;
  font-size: 12px;
  color: var(--ink-dim);
  max-width: 34ch;
  line-height: 1.5;
}

#start-plate:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
</style>
</head>
<body>

<div id="shell">
  <header id="brand">
    <span class="logo">VOLTAGE</span>
    <span class="sub">analog polysynth</span>
    <span class="spacer"></span>
    <span id="status" aria-live="polite">standby</span>
  </header>
  <div id="presets">
    <label class="pr-label" for="preset-list">Patch</label>
    <select id="preset-list" aria-label="Patch"></select>
    <input id="preset-name" type="text" aria-label="Patch name" placeholder="name" maxlength="40">
    <button id="preset-save" type="button">Save</button>
    <button id="preset-delete" type="button">Delete</button>
    <button id="preset-export" type="button">Export</button>
    <button id="preset-import" type="button">Import</button>
    <input id="preset-file" type="file" accept="application/json,.json" hidden>
    <span id="preset-msg" role="status"></span>
  </div>
  <div id="panel"></div>
  <div id="keyboard"></div>
</div>

<div id="start-plate" role="button" tabindex="0" aria-label="Power on the synthesizer">
  <div class="plate-inner">
    <div class="plate-title">VOLTAGE</div>
    <div class="plate-text">Click to power on</div>
    <div class="plate-note">
      A browser starts the sound only after you act. One click is enough.
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================================
     1. The patch model.

     One table for every control. The engine, the panel and the presets all
     read this table. Thus a new control is one row here, and not a change in
     three places.
     ========================================================================= */

  var WAVES = ['sine', 'tri', 'saw', 'pulse'];

  var PARAMS = [
    { id: 'osc1Wave', section: 'osc', label: 'Wave 1', type: 'select', options: WAVES, def: 'saw' },
    { id: 'osc1Oct', section: 'osc', label: 'Oct 1', type: 'knob', min: -2, max: 2, step: 1, unit: '', def: 0 },
    { id: 'osc1Detune', section: 'osc', label: 'Tune 1', type: 'knob', min: -50, max: 50, unit: 'ct', def: 0 },
    { id: 'osc1Width', section: 'osc', label: 'Width 1', type: 'knob', min: 0.05, max: 0.95, unit: '', def: 0.5 },
    { id: 'osc1Level', section: 'osc', label: 'Level 1', type: 'knob', min: 0, max: 1, unit: '', def: 0.8 },

    { id: 'osc2Wave', section: 'osc', label: 'Wave 2', type: 'select', options: WAVES, def: 'saw' },
    { id: 'osc2Oct', section: 'osc', label: 'Oct 2', type: 'knob', min: -2, max: 2, step: 1, unit: '', def: 0 },
    { id: 'osc2Detune', section: 'osc', label: 'Tune 2', type: 'knob', min: -50, max: 50, unit: 'ct', def: 7 },
    { id: 'osc2Width', section: 'osc', label: 'Width 2', type: 'knob', min: 0.05, max: 0.95, unit: '', def: 0.5 },
    { id: 'osc2Level', section: 'osc', label: 'Level 2', type: 'knob', min: 0, max: 1, unit: '', def: 0.6 },

    { id: 'subLevel', section: 'osc', label: 'Sub', type: 'knob', min: 0, max: 1, unit: '', def: 0.25 },
    { id: 'noiseLevel', section: 'osc', label: 'Noise', type: 'knob', min: 0, max: 1, unit: '', def: 0 },

    { id: 'cutoff', section: 'filter', label: 'Cutoff', type: 'knob', min: 20, max: 18000, curve: 'exp', unit: 'Hz', def: 2200 },
    { id: 'reso', section: 'filter', label: 'Reso', type: 'knob', min: 0.5, max: 18, unit: 'Q', def: 2 },
    { id: 'filterEnv', section: 'filter', label: 'Env Amt', type: 'knob', min: -4800, max: 4800, unit: 'ct', def: 1800 },
    { id: 'keyTrack', section: 'filter', label: 'Key Trk', type: 'knob', min: 0, max: 1, unit: '', def: 0.35 },

    { id: 'ampAttack', section: 'amp', label: 'Attack', type: 'knob', min: 0.001, max: 10, curve: 'exp', unit: 's', def: 0.008 },
    { id: 'ampDecay', section: 'amp', label: 'Decay', type: 'knob', min: 0.001, max: 10, curve: 'exp', unit: 's', def: 0.25 },
    { id: 'ampSustain', section: 'amp', label: 'Sustain', type: 'knob', min: 0, max: 1, unit: '', def: 0.7 },
    { id: 'ampRelease', section: 'amp', label: 'Release', type: 'knob', min: 0.001, max: 10, curve: 'exp', unit: 's', def: 0.3 },

    { id: 'filtAttack', section: 'fenv', label: 'Attack', type: 'knob', min: 0.001, max: 10, curve: 'exp', unit: 's', def: 0.005 },
    { id: 'filtDecay', section: 'fenv', label: 'Decay', type: 'knob', min: 0.001, max: 10, curve: 'exp', unit: 's', def: 0.4 },
    { id: 'filtSustain', section: 'fenv', label: 'Sustain', type: 'knob', min: 0, max: 1, unit: '', def: 0.25 },
    { id: 'filtRelease', section: 'fenv', label: 'Release', type: 'knob', min: 0.001, max: 10, curve: 'exp', unit: 's', def: 0.3 },

    { id: 'lfoWave', section: 'lfo', label: 'Shape', type: 'select', options: ['tri', 'sine', 'square', 'saw'], def: 'tri' },
    { id: 'lfoRate', section: 'lfo', label: 'Rate', type: 'knob', min: 0.05, max: 30, curve: 'exp', unit: 'Hz', def: 5 },
    { id: 'lfoDepth', section: 'lfo', label: 'Depth', type: 'knob', min: 0, max: 1, unit: '', def: 0 },
    { id: 'lfoDest', section: 'lfo', label: 'To', type: 'select', options: ['pitch', 'filter', 'width'], def: 'pitch' },

    { id: 'mode', section: 'voice', label: 'Mode', type: 'select', options: ['poly', 'mono'], def: 'poly' },
    { id: 'glide', section: 'voice', label: 'Glide', type: 'knob', min: 0, max: 2, unit: 's', def: 0 },

    { id: 'delayOn', section: 'fx', label: 'Delay', type: 'switch', def: true },
    { id: 'delayTime', section: 'fx', label: 'Time', type: 'knob', min: 0.02, max: 1, curve: 'exp', unit: 's', def: 0.3 },
    { id: 'delayFb', section: 'fx', label: 'Feedback', type: 'knob', min: 0, max: 0.9, unit: '', def: 0.35 },
    { id: 'delayTone', section: 'fx', label: 'Tone', type: 'knob', min: 500, max: 12000, curve: 'exp', unit: 'Hz', def: 3500 },
    { id: 'delayMix', section: 'fx', label: 'Delay Mix', type: 'knob', min: 0, max: 1, unit: '', def: 0.22 },

    { id: 'revOn', section: 'fx', label: 'Reverb', type: 'switch', def: true },
    { id: 'revSize', section: 'fx', label: 'Size', type: 'knob', min: 0.2, max: 4, unit: 's', def: 1.8 },
    { id: 'revMix', section: 'fx', label: 'Rev Mix', type: 'knob', min: 0, max: 1, unit: '', def: 0.25 },

    { id: 'masterVol', section: 'master', label: 'Volume', type: 'knob', min: 0, max: 1, unit: '', def: 0.7 }
  ];

  var PARAM_BY_ID = {};
  for (var pi = 0; pi < PARAMS.length; pi++) PARAM_BY_ID[PARAMS[pi].id] = PARAMS[pi];

  function defaultPatch() {
    var params = {};
    for (var i = 0; i < PARAMS.length; i++) params[PARAMS[i].id] = PARAMS[i].def;
    return { name: 'Init', params: params };
  }

  /* =========================================================================
     2. Small helpers for the audio graph.
     ========================================================================= */

  var VOICE_GAIN = 0.14;   // head room: eight voices must not clip the output
  var GATE = 0.005;        // a gate ramp of 5 ms. A jump gives a click.
  var STEAL = 0.005;       // how fast a stolen voice falls silent
  var MAX_VOICES = 8;
  var MAX_PULSE_DELAY = 0.2;

  function midiHz(midi) {
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  // Moves a parameter to a value over a short time. A jump gives a click.
  function ramp(param, value, time, dur) {
    var t = Math.max(time, 0);
    hold(param, t);
    param.linearRampToValueAtTime(value, t + (dur == null ? GATE : dur));
  }

  // Keeps the value that the parameter has at a time, and drops what was
  // scheduled after it. Firefox has no cancelAndHoldAtTime.
  function hold(param, t) {
    if (param.cancelAndHoldAtTime) param.cancelAndHoldAtTime(t);
    else {
      param.cancelScheduledValues(t);
      param.setValueAtTime(param.value, t);
    }
  }

  function clamp(v, lo, hi) {
    return v < lo ? lo : v > hi ? hi : v;
  }

  /* An ADSR envelope on one audio parameter.
   *
   * The attack is a straight ramp. The decay goes to the sustain level with
   * setTargetAtTime, because an analog envelope falls like that, and a
   * straight fall sounds hard.
   *
   * gate(): note on. release(): note off. The release also ends with a short
   * straight ramp to exactly zero, because setTargetAtTime comes near zero but
   * never reaches it, and the voice must be silent before its nodes stop.
   * Without that ramp the stop cuts a signal that is not zero, and that is a
   * click.
   */
  var ENV_TAIL = 0.006;

  function gateEnv(param, t0, peak, a, d, s) {
    var att = Math.max(a, GATE);
    param.cancelScheduledValues(t0);
    param.setValueAtTime(0, t0);
    param.linearRampToValueAtTime(peak, t0 + att);
    param.setTargetAtTime(peak * s, t0 + att, Math.max(d, 0.001) / 3);
  }

  function releaseEnv(param, t, r) {
    var rel = Math.max(r, GATE);
    hold(param, t);
    param.setTargetAtTime(0, t, rel / 4);
    hold(param, t + rel);
    param.linearRampToValueAtTime(0, t + rel + ENV_TAIL);
    return t + rel + ENV_TAIL;
  }

  // A generator with a fixed seed. See noiseBuffer.
  function rng(seed) {
    var s = seed | 0;
    return function () {
      s ^= s << 13; s |= 0;
      s ^= s >>> 17;
      s ^= s << 5; s |= 0;
      return s / 2147483648;
    };
  }

  /* The impulse response of the reverb.
   *
   * The solution computes it, and thus the file needs no sound file from a
   * server. Noise that falls away is a plain room: every reflection at every
   * time, softer and softer. The two channels get their own noise, and that
   * makes the reverb wide.
   */
  function impulse(ctx, seconds) {
    var len = Math.max(64, Math.floor(ctx.sampleRate * seconds));
    var buf = ctx.createBuffer(2, len, ctx.sampleRate);
    var next = rng(0x2545f491);
    for (var ch = 0; ch < 2; ch++) {
      var d = buf.getChannelData(ch);
      for (var i = 0; i < len; i++) {
        d[i] = next() * Math.pow(1 - i / len, 2.5);
      }
    }
    return buf;
  }

  // One white noise buffer per audio context, shared by every voice.
  //
  // The numbers come from a generator with a fixed seed, and not from
  // Math.random. White noise from a fixed seed sounds the same as white noise
  // from any other seed, and it makes every render of the synthesizer give the
  // same samples. Thus a test of the noise gives the same result at each run.
  function noiseBuffer(ctx) {
    if (!ctx.__voltageNoise) {
      var len = Math.floor(ctx.sampleRate * 2);
      var buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = buf.getChannelData(0);
      var next = rng(0x9e3779b9);
      for (var i = 0; i < len; i++) d[i] = next();
      ctx.__voltageNoise = buf;
    }
    return ctx.__voltageNoise;
  }

  /* One oscillator that can also make a pulse.
   *
   * The Web Audio API has no pulse oscillator with a width that the user can
   * change. A sawtooth minus the same sawtooth, delayed, is a rectangular
   * wave, and the delay time gives the width. Thus the same four nodes make
   * every waveform: for a wave that is not a pulse the inverted path is
   * silent, and the type of the oscillator gives the wave. In this way the
   * user can change the waveform while a note sounds, without a new node.
   */
  function createSource(ctx) {
    var osc = ctx.createOscillator();
    var delay = ctx.createDelay(MAX_PULSE_DELAY);
    var inv = ctx.createGain();
    var out = ctx.createGain();
    inv.gain.value = 0;
    osc.connect(out);
    osc.connect(delay);
    delay.connect(inv);
    inv.connect(out);
    return { osc: osc, delay: delay, inv: inv, out: out };
  }

  /* Writes a value to an audio parameter.
   *
   * With no time, the value is written at once. That is for a node that is
   * being built, and that makes no sound yet. With a time, the value moves
   * over a few milliseconds, because the user is turning a knob while a note
   * sounds, and a jump in a level is a click.
   */
  function put(param, value, t, dur) {
    if (t == null) param.value = value;
    else ramp(param, value, t, dur);
  }

  // The same, for a frequency. A frequency moves over its pitch, and thus
  // exponentially, and never through zero.
  function putFreq(param, value, t) {
    var v = Math.max(1e-3, value);
    if (t == null) param.value = v;
    else {
      hold(param, t);
      param.exponentialRampToValueAtTime(v, t + GATE);
    }
  }

  /* The soft clip of the output stage.
   *
   * The curve is tanh(x). Its slope at zero is exactly 1, and thus a quiet
   * signal passes through as it is. It bends only as it comes near the top,
   * where an analog output stage bends too, and that is where the warmth of a
   * loud analog synthesizer comes from. A value over the end of the curve is
   * held at the end, and thus the output never leaves -1 to 1.
   *
   * Do not give this curve a drive and then divide by tanh(drive) to bring the
   * end back to 1. That gives the curve a slope of drive/tanh(drive) at zero,
   * and then the stage is not a limiter but a distortion box: it lifts every
   * quiet sound, it adds harmonics at every level, and the sum of several
   * notes gets tones that no note played.
   */
  function softClipCurve() {
    // An odd length, and thus the curve holds a sample in the middle, at an
    // input of exactly zero. A volume of zero then gives an output of exactly
    // zero, and not a very small number.
    var n = 2049;
    var curve = new Float32Array(n);
    for (var i = 0; i < n; i++) {
      curve[i] = Math.tanh((i / (n - 1)) * 2 - 1);
    }
    return curve;
  }

  var OSC_TYPE = { sine: 'sine', tri: 'triangle', saw: 'sawtooth', pulse: 'sawtooth' };
  var LFO_TYPE = { tri: 'triangle', sine: 'sine', square: 'square', saw: 'sawtooth' };

  // How far a depth of 1 reaches, per destination.
  var LFO_PITCH_CENTS = 200;
  var LFO_FILTER_CENTS = 3600;
  var LFO_WIDTH = 0.45;

  function setSourceWave(src, wave, t) {
    src.osc.type = OSC_TYPE[wave] || 'sawtooth';
    put(src.inv.gain, wave === 'pulse' ? -1 : 0, t);
  }

  function setSourceWidth(src, wave, width, freq, t) {
    // The width of the pulse is the delay time multiplied by the frequency.
    var d = wave === 'pulse' ? width / Math.max(1, freq) : 0;
    put(src.delay.delayTime, Math.min(MAX_PULSE_DELAY, d), t);
  }

  /* =========================================================================
     3. The voice.
     ========================================================================= */

  function createVoice(ctx, p, midi, vel, out, t0) {
    var base = midiHz(midi);
    var note = midi;
    var mix = ctx.createGain();

    var srcs = [createSource(ctx), createSource(ctx)];
    var freqs = [0, 0];

    var sub = ctx.createOscillator();
    sub.type = 'square';
    var subGain = ctx.createGain();
    sub.connect(subGain);
    subGain.connect(mix);

    var noise = ctx.createBufferSource();
    noise.buffer = noiseBuffer(ctx);
    noise.loop = true;
    var noiseGain = ctx.createGain();
    noise.connect(noiseGain);
    noiseGain.connect(mix);

    srcs[0].out.connect(mix);
    srcs[1].out.connect(mix);

    // A pulse whose width is not 50 percent holds a DC offset. Without this
    // filter the offset moves the signal away from zero, and then the gate
    // gives a click.
    var dc = ctx.createBiquadFilter();
    dc.type = 'highpass';
    dc.frequency.value = 12;
    mix.connect(dc);

    // The filter. Two low pass sections in series give 24 dB per octave, the
    // slope of the ladder filter of an analog synthesizer. The first section
    // stays flat; the resonance goes to the second section.
    var f1 = ctx.createBiquadFilter();
    var f2 = ctx.createBiquadFilter();
    f1.type = 'lowpass';
    f2.type = 'lowpass';
    f1.Q.value = 0.707;
    dc.connect(f1);
    f1.connect(f2);

    // The modulation bus of the cutoff, in cents. The filter envelope and the
    // LFO go in here. A modulation in cents multiplies the frequency, and thus
    // it is an interval, and it sounds the same at every cutoff. With nothing
    // connected, this node gives zero, and the cutoff does not move.
    var fmod = ctx.createGain();
    fmod.connect(f1.detune);
    fmod.connect(f2.detune);

    /* The LFO. One per voice, free running.
     *
     * Every destination gets its own gain, and the destination that is not
     * chosen keeps a gain of zero. A signal into an audio parameter is added
     * to the value of that parameter. Thus a depth of zero adds exactly zero,
     * and the output is then the same as an output without an LFO. That is
     * what the requirement asks.
     */
    var lfo = ctx.createOscillator();
    var lfoPitch = ctx.createGain();
    var lfoFilt = ctx.createGain();
    var lfoW1 = ctx.createGain();
    var lfoW2 = ctx.createGain();
    lfoPitch.gain.value = 0;
    lfoFilt.gain.value = 0;
    lfoW1.gain.value = 0;
    lfoW2.gain.value = 0;
    lfo.connect(lfoPitch);
    lfo.connect(lfoFilt);
    lfo.connect(lfoW1);
    lfo.connect(lfoW2);
    lfoPitch.connect(srcs[0].osc.detune);
    lfoPitch.connect(srcs[1].osc.detune);
    lfoPitch.connect(sub.detune);
    lfoFilt.connect(fmod);
    lfoW1.connect(srcs[0].delay.delayTime);
    lfoW2.connect(srcs[1].delay.delayTime);

    // The filter envelope. A constant source, shaped from 0 to 1, through a
    // gain that scales it to the envelope amount in cents, into the modulation
    // bus of the cutoff.
    var fenv = ctx.createConstantSource();
    fenv.offset.value = 0;
    var fenvAmt = ctx.createGain();
    fenvAmt.gain.value = 0;
    fenv.connect(fenvAmt);
    fenvAmt.connect(fmod);

    // The amplifier.
    var vca = ctx.createGain();
    vca.gain.value = 0;
    f2.connect(vca);
    vca.connect(out);

    var voice = {
      midi: midi,
      vel: vel,
      startTime: t0,
      endTime: null,
      nodes: { srcs: srcs, sub: sub, noise: noise, vca: vca, mix: mix, dc: dc, f1: f1, f2: f2, fmod: fmod }
    };

    var cur = p.params;

    /* Writes the whole patch to the voice.
     *
     * With no time it writes at once: that is the voice that is being built.
     * With a time it moves every value over a few milliseconds: that is the
     * user, turning a knob while this voice sounds.
     */
    voice.set = function (params, t) {
      cur = params;
      for (var i = 0; i < 2; i++) {
        var n = i + 1;
        var wave = params['osc' + n + 'Wave'];
        var f = base * Math.pow(2, params['osc' + n + 'Oct']);
        freqs[i] = f;
        setSourceWave(srcs[i], wave, t);
        putFreq(srcs[i].osc.frequency, f, t);
        put(srcs[i].osc.detune, params['osc' + n + 'Detune'], t);
        setSourceWidth(srcs[i], wave, params['osc' + n + 'Width'], f, t);
        put(srcs[i].out.gain, params['osc' + n + 'Level'], t);
      }
      putFreq(sub.frequency, base / 2, t);
      put(subGain.gain, params.subLevel, t);
      put(noiseGain.gain, params.noiseLevel, t);

      // The keyboard tracking multiplies the cutoff. At a tracking of 1 a note
      // one octave higher gives a cutoff one octave higher.
      var track = Math.pow(2, (params.keyTrack * (note - 60)) / 12);
      putFreq(f1.frequency, clamp(params.cutoff * track, 20, 20000), t);
      putFreq(f2.frequency, clamp(params.cutoff * track, 20, 20000), t);
      put(f2.Q, params.reso, t);
      put(fenvAmt.gain, params.filterEnv, t);

      lfo.type = LFO_TYPE[params.lfoWave] || 'triangle';
      putFreq(lfo.frequency, params.lfoRate, t);
      var d = params.lfoDepth;
      var dest = params.lfoDest;
      put(lfoPitch.gain, dest === 'pitch' ? d * LFO_PITCH_CENTS : 0, t);
      put(lfoFilt.gain, dest === 'filter' ? d * LFO_FILTER_CENTS : 0, t);
      // The width of a pulse is the delay time multiplied by the frequency.
      // Thus the depth in seconds depends on the frequency of that source.
      put(lfoW1.gain, dest === 'width' ? (d * LFO_WIDTH) / freqs[0] : 0, t);
      put(lfoW2.gain, dest === 'width' ? (d * LFO_WIDTH) / freqs[1] : 0, t);
    };

    voice.set(p.params);

    // The gate: note on.
    gateEnv(vca.gain, t0, VOICE_GAIN * vel, cur.ampAttack, cur.ampDecay, cur.ampSustain);
    gateEnv(fenv.offset, t0, 1, cur.filtAttack, cur.filtDecay, cur.filtSustain);

    voice.release = function (t) {
      var when = Math.max(t, t0);
      var end = releaseEnv(vca.gain, when, cur.ampRelease);
      releaseEnv(fenv.offset, when, cur.filtRelease);
      voice.endTime = end;
      stopAt(end + 0.005);
    };

    // Takes the voice away for a new note. The level falls over a few
    // milliseconds, and a jump would be a click.
    voice.steal = function (t) {
      var end = t + STEAL;
      hold(vca.gain, t);
      vca.gain.linearRampToValueAtTime(0, end);
      voice.endTime = end;
      stopAt(end + 0.005);
    };

    /* Moves the voice to another note. In mono mode this is the glide: the
     * envelopes do not start again, and only the pitch moves. A glide is
     * exponential in hertz, because that is a straight line in pitch.
     */
    voice.retune = function (midi2, t, glide) {
      note = midi2;
      base = midiHz(midi2);
      voice.midi = midi2;
      var g = Math.max(glide || 0, 0);
      for (var i = 0; i < 2; i++) {
        var n = i + 1;
        var f = base * Math.pow(2, cur['osc' + n + 'Oct']);
        freqs[i] = f;
        var wave = cur['osc' + n + 'Wave'];
        var d = wave === 'pulse' ? Math.min(MAX_PULSE_DELAY, cur['osc' + n + 'Width'] / f) : 0;
        if (g > 0) {
          hold(srcs[i].osc.frequency, t);
          srcs[i].osc.frequency.exponentialRampToValueAtTime(f, t + g);
          ramp(srcs[i].delay.delayTime, d, t, g);
        } else {
          srcs[i].osc.frequency.setValueAtTime(f, t);
          srcs[i].delay.delayTime.setValueAtTime(d, t);
        }
        // The depth of the pulse width modulation depends on the frequency.
        if (cur.lfoDest === 'width') {
          var wg = i === 0 ? lfoW1 : lfoW2;
          ramp(wg.gain, (cur.lfoDepth * LFO_WIDTH) / f, t, g > 0 ? g : GATE);
        }
      }
      var fc = clamp(cur.cutoff * Math.pow(2, (cur.keyTrack * (note - 60)) / 12), 20, 20000);
      if (g > 0) {
        hold(sub.frequency, t);
        sub.frequency.exponentialRampToValueAtTime(base / 2, t + g);
        hold(f1.frequency, t);
        f1.frequency.exponentialRampToValueAtTime(fc, t + g);
        hold(f2.frequency, t);
        f2.frequency.exponentialRampToValueAtTime(fc, t + g);
      } else {
        sub.frequency.setValueAtTime(base / 2, t);
        f1.frequency.setValueAtTime(fc, t);
        f2.frequency.setValueAtTime(fc, t);
      }
    };

    function stopAt(t) {
      srcs[0].osc.stop(t);
      srcs[1].osc.stop(t);
      sub.stop(t);
      noise.stop(t);
      fenv.stop(t);
      lfo.stop(t);
    }

    voice.stop = stopAt;

    voice.dispose = function () {
      try {
        mix.disconnect();
        dc.disconnect();
        f1.disconnect();
        f2.disconnect();
        fmod.disconnect();
        fenv.disconnect();
        fenvAmt.disconnect();
        lfo.disconnect();
        lfoPitch.disconnect();
        lfoFilt.disconnect();
        lfoW1.disconnect();
        lfoW2.disconnect();
        vca.disconnect();
      } catch (e) { /* already gone */ }
    };

    srcs[0].osc.start(t0);
    srcs[1].osc.start(t0);
    sub.start(t0);
    noise.start(t0);
    fenv.start(t0);
    lfo.start(t0);

    return voice;
  }

  /* =========================================================================
     4. The engine. It takes the audio context as an argument, and it never
        makes one itself. Thus a test can give it an OfflineAudioContext and
        look at the samples of the same engine that the user hears.
        Task T7 gives it the polyphony and the mono mode.
     ========================================================================= */

  function createEngine(ctx, destination) {
    var patch = defaultPatch();
    var voices = [];
    var stack = [];   // the notes that are held, for mono mode
    var mono = null;  // the one voice of mono mode

    /* The master chain: the voices, then the delay, then the reverb.
     *
     * Each effect has a dry path with a gain of 1 and a wet path with the mix.
     * An effect that is off has a wet gain of exactly zero, and thus it adds
     * exactly nothing: the output is then the dry signal, sample for sample.
     */
    var master = ctx.createGain();   // the voice bus

    var dlyDry = ctx.createGain();
    var dlyWet = ctx.createGain();
    var dlyOut = ctx.createGain();
    var dL = ctx.createDelay(2);
    var dR = ctx.createDelay(2);
    var toneL = ctx.createBiquadFilter();
    var toneR = ctx.createBiquadFilter();
    var fbL = ctx.createGain();
    var fbR = ctx.createGain();
    var merger = ctx.createChannelMerger(2);
    toneL.type = 'lowpass';
    toneR.type = 'lowpass';
    dlyDry.gain.value = 1;
    dlyWet.gain.value = 0;

    master.connect(dlyDry);
    dlyDry.connect(dlyOut);
    master.connect(dL);
    master.connect(dR);
    // Two delay lines with a different time. Thus the left channel and the
    // right channel are not the same, and the delay is wide.
    dL.connect(toneL);
    toneL.connect(fbL);
    fbL.connect(dL);
    dR.connect(toneR);
    toneR.connect(fbR);
    fbR.connect(dR);
    dL.connect(merger, 0, 0);
    dR.connect(merger, 0, 1);
    merger.connect(dlyWet);
    dlyWet.connect(dlyOut);

    var revDry = ctx.createGain();
    var revWet = ctx.createGain();
    var revOut = ctx.createGain();
    var conv = ctx.createConvolver();
    var revSize = -1;
    revDry.gain.value = 1;
    revWet.gain.value = 0;

    dlyOut.connect(revDry);
    revDry.connect(revOut);
    dlyOut.connect(conv);
    conv.connect(revWet);
    revWet.connect(revOut);

    // The output stage: the master volume, and then the soft clip that holds
    // the output between -1 and 1.
    var masterGain = ctx.createGain();
    var shaper = ctx.createWaveShaper();
    shaper.curve = softClipCurve();
    revOut.connect(masterGain);
    masterGain.connect(shaper);
    shaper.connect(destination);

    function applyFx(params, t) {
      put(dlyWet.gain, params.delayOn ? params.delayMix : 0, t);
      // The delay time moves over a longer ramp. A delay line that changes its
      // time bends the pitch of what is in it, as a tape delay does.
      put(dL.delayTime, params.delayTime, t, 0.05);
      put(dR.delayTime, params.delayTime * 0.68, t, 0.05);
      put(fbL.gain, params.delayFb, t);
      put(fbR.gain, params.delayFb, t);
      putFreq(toneL.frequency, params.delayTone, t);
      putFreq(toneR.frequency, params.delayTone, t);

      put(revWet.gain, params.revOn ? params.revMix : 0, t);
      // Making the impulse response costs time, and thus it is made again only
      // when the size changed.
      if (params.revSize !== revSize) {
        revSize = params.revSize;
        conv.buffer = impulse(ctx, revSize);
      }

      put(masterGain.gain, params.masterVol, t);
    }

    applyFx(patch.params);

    function now(time) {
      return time == null ? ctx.currentTime : time;
    }

    function alive(v) {
      return v.endTime === null || v.endTime > ctx.currentTime;
    }

    function prune() {
      for (var i = voices.length - 1; i >= 0; i--) {
        if (!alive(voices[i])) {
          voices[i].dispose();
          voices.splice(i, 1);
        }
      }
    }

    function held() {
      var out = [];
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].endTime === null) out.push(voices[i]);
      }
      return out;
    }

    function start(midi, vel, t) {
      var v = createVoice(ctx, patch, midi, vel, master, t);
      voices.push(v);
      return v;
    }

    function noteOn(midi, vel, time) {
      var t = now(time);
      var v = vel == null ? 1 : vel;
      prune();

      if (patch.params.mode === 'mono') {
        // The note stack: the newest held note sounds. A note that is
        // released gives the voice back to the note that is still held.
        var at = stack.indexOf(midi);
        if (at >= 0) stack.splice(at, 1);
        stack.push(midi);
        if (mono && mono.endTime === null) {
          mono.retune(midi, t, patch.params.glide);
          return mono;
        }
        mono = start(midi, v, t);
        return mono;
      }

      var on = held();
      if (on.length >= MAX_VOICES) {
        // Take the oldest voice. It falls silent over a few milliseconds.
        var oldest = on[0];
        for (var i = 1; i < on.length; i++) {
          if (on[i].startTime < oldest.startTime) oldest = on[i];
        }
        oldest.steal(t);
      }
      return start(midi, v, t);
    }

    function noteOff(midi, time) {
      var t = now(time);

      if (patch.params.mode === 'mono') {
        var at = stack.indexOf(midi);
        if (at >= 0) stack.splice(at, 1);
        if (!mono || mono.endTime !== null) return;
        if (stack.length > 0) mono.retune(stack[stack.length - 1], t, patch.params.glide);
        else mono.release(t);
        return;
      }

      for (var i = voices.length - 1; i >= 0; i--) {
        if (voices[i].midi === midi && voices[i].endTime === null) {
          voices[i].release(t);
          return;
        }
      }
    }

    function allNotesOff(time) {
      var t = now(time);
      stack.length = 0;
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].endTime === null) voices[i].release(t);
      }
    }

    /* Changes one parameter.
     *
     * The change reaches the voices that sound now, over a short ramp, and
     * thus turning a knob while a note sounds gives no click. `time` is for a
     * test that renders offline: there, the clock of the context stands at
     * zero while the test sets everything up, and thus the test says when the
     * change must happen.
     */
    function setParam(id, value, time) {
      patch.params[id] = value;
      var t = time == null ? ctx.currentTime : time;
      applyFx(patch.params, t);
      for (var i = 0; i < voices.length; i++) voices[i].set(patch.params, t);
    }

    function setPatch(p, time) {
      patch = { name: p.name || 'Init', params: {} };
      var d = defaultPatch().params;
      for (var k in d) patch.params[k] = p.params && p.params[k] !== undefined ? p.params[k] : d[k];
      var t = time === undefined ? null : time;
      applyFx(patch.params, t);
      for (var i = 0; i < voices.length; i++) voices[i].set(patch.params, t);
    }

    function getPatch() {
      var out = { name: patch.name, params: {} };
      for (var k in patch.params) out.params[k] = patch.params[k];
      return out;
    }

    function voiceCount() {
      prune();
      return voices.length;
    }

    return {
      master: master,
      noteOn: noteOn,
      noteOff: noteOff,
      allNotesOff: allNotesOff,
      setParam: setParam,
      setPatch: setPatch,
      getPatch: getPatch,
      voiceCount: voiceCount
    };
  }

  /* =========================================================================
     5. The panel.

     The panel is built from PARAMS. A new control is a new row in that table,
     and nothing here changes.
     ========================================================================= */

  // `cols` is how many controls stand next to each other in a section. It
  // keeps the rows of the panel together: oscillator 1 on one row, oscillator
  // 2 under it, the delay on one row and the reverb under it.
  var SECTIONS = [
    { id: 'osc', title: 'Oscillators', cols: 5 },
    { id: 'filter', title: 'Filter', cols: 4 },
    { id: 'fenv', title: 'Filter Envelope', cols: 4 },
    { id: 'amp', title: 'Amp Envelope', cols: 4 },
    { id: 'lfo', title: 'LFO', cols: 4 },
    { id: 'voice', title: 'Voice', cols: 2 },
    { id: 'fx', title: 'Effects', cols: 5 },
    { id: 'master', title: 'Master', cols: 1 }
  ];

  var CELL = 62;
  var CELL_GAP = 6;

  var KNOB_TRAVEL = 180;   // pixels of drag for the whole range
  var KNOB_SWEEP = 270;    // degrees that the indicator turns

  // The place of a value in its range, from 0 to 1. A frequency or a time has
  // an exponential curve: then the same turn of the knob gives the same
  // interval, low and high.
  function toNorm(p, v) {
    if (p.curve === 'exp') return Math.log(v / p.min) / Math.log(p.max / p.min);
    return (v - p.min) / (p.max - p.min);
  }

  function fromNorm(p, n) {
    var v = p.curve === 'exp'
      ? p.min * Math.pow(p.max / p.min, n)
      : p.min + n * (p.max - p.min);
    if (p.step) v = Math.round(v / p.step) * p.step;
    return clamp(v, p.min, p.max);
  }

  function formatValue(p, v) {
    if (p.unit === 'Hz') return v >= 1000 ? (v / 1000).toFixed(2) + ' kHz' : v.toFixed(0) + ' Hz';
    if (p.unit === 's') return v < 1 ? (v * 1000).toFixed(0) + ' ms' : v.toFixed(2) + ' s';
    if (p.unit === 'ct') return v.toFixed(0) + ' ct';
    if (p.unit === 'Q') return 'Q ' + v.toFixed(1);
    if (p.step) return String(v);
    return v.toFixed(2);
  }

  function el(tag, cls, parent) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (parent) parent.appendChild(e);
    return e;
  }

  /* One rotary knob.
   *
   * The drag uses pointer capture: the knob keeps the pointer until the button
   * goes up, and thus the drag goes on outside the knob, as a real knob does
   * under a finger that slides off it.
   */
  function createKnob(p, onChange) {
    var cell = el('div', 'ctrl');
    var knob = el('div', 'knob', cell);
    var ind = el('div', 'knob-ind', knob);
    var label = el('div', 'ctrl-label', cell);
    var readout = el('div', 'ctrl-value', cell);
    label.textContent = p.label;

    knob.setAttribute('role', 'slider');
    knob.setAttribute('tabindex', '0');
    knob.setAttribute('aria-label', p.label);
    knob.setAttribute('aria-valuemin', String(p.min));
    knob.setAttribute('aria-valuemax', String(p.max));
    knob.dataset.param = p.id;

    var value = p.def;

    function render() {
      var n = toNorm(p, value);
      ind.style.transform = 'rotate(' + (n * KNOB_SWEEP - KNOB_SWEEP / 2) + 'deg)';
      readout.textContent = formatValue(p, value);
      knob.setAttribute('aria-valuenow', String(value));
      knob.setAttribute('aria-valuetext', formatValue(p, value));
    }

    function put(v) {
      var next = clamp(v, p.min, p.max);
      if (next === value) return;
      value = next;
      render();
      onChange(p.id, value);
    }

    var dragFrom = 0;
    var dragNorm = 0;

    knob.addEventListener('pointerdown', function (e) {
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      knob.setPointerCapture(e.pointerId);
      dragFrom = e.clientY;
      dragNorm = toNorm(p, value);
      e.preventDefault();
    });

    knob.addEventListener('pointermove', function (e) {
      if (!knob.hasPointerCapture(e.pointerId)) return;
      // Up is more, down is less. The shift key makes the drag fine.
      var travel = (dragFrom - e.clientY) / (e.shiftKey ? KNOB_TRAVEL * 5 : KNOB_TRAVEL);
      put(fromNorm(p, clamp(dragNorm + travel, 0, 1)));
    });

    knob.addEventListener('pointerup', function (e) {
      if (knob.hasPointerCapture(e.pointerId)) knob.releasePointerCapture(e.pointerId);
    });

    knob.addEventListener('dblclick', function () { put(p.def); });

    knob.addEventListener('keydown', function (e) {
      var step = p.step ? p.step / (p.max - p.min) : 0.01;
      var n = toNorm(p, value);
      var k = e.key;
      if (k === 'ArrowUp' || k === 'ArrowRight') put(fromNorm(p, clamp(n + step, 0, 1)));
      else if (k === 'ArrowDown' || k === 'ArrowLeft') put(fromNorm(p, clamp(n - step, 0, 1)));
      else if (k === 'PageUp') put(fromNorm(p, clamp(n + step * 10, 0, 1)));
      else if (k === 'PageDown') put(fromNorm(p, clamp(n - step * 10, 0, 1)));
      else if (k === 'Home') put(p.min);
      else if (k === 'End') put(p.max);
      else return;
      e.preventDefault();
    });

    render();
    return {
      el: cell,
      render: function (v) { value = clamp(v, p.min, p.max); render(); }
    };
  }

  function createSwitch(p, onChange) {
    var cell = el('div', 'ctrl');
    var btn = el('button', 'switch', cell);
    var text = el('span', 'switch-text', btn);
    var label = el('div', 'ctrl-label', cell);
    var pad = el('div', 'ctrl-value', cell);
    label.textContent = p.label;
    pad.textContent = '';
    btn.type = 'button';
    btn.setAttribute('role', 'switch');
    btn.setAttribute('aria-label', p.label);
    btn.dataset.param = p.id;

    var value = p.def;

    function render() {
      btn.setAttribute('aria-checked', value ? 'true' : 'false');
      text.textContent = value ? 'ON' : 'OFF';
    }

    function put(v) {
      if (v === value) return;
      value = v;
      render();
      onChange(p.id, value);
    }

    btn.addEventListener('click', function () { put(!value); });
    btn.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') put(true);
      else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') put(false);
      else return;
      e.preventDefault();
    });

    render();
    return { el: cell, render: function (v) { value = !!v; render(); } };
  }

  // A select is a select of the browser. It already has a role, a name and the
  // arrow keys, and it does that better than anything built here.
  function createSelect(p, onChange) {
    var cell = el('div', 'ctrl');
    var sel = el('select', 'sel', cell);
    var label = el('div', 'ctrl-label', cell);
    var pad = el('div', 'ctrl-value', cell);
    label.textContent = p.label;
    pad.textContent = '';
    sel.setAttribute('aria-label', p.label);
    sel.dataset.param = p.id;

    for (var i = 0; i < p.options.length; i++) {
      var o = el('option', null, sel);
      o.value = p.options[i];
      o.textContent = p.options[i];
    }
    sel.value = p.def;

    sel.addEventListener('change', function () { onChange(p.id, sel.value); });

    return { el: cell, render: function (v) { sel.value = v; } };
  }

  function buildPanel(root, onChange) {
    var grid = el('div', null, root);
    grid.id = 'panel-grid';
    var controls = {};

    for (var i = 0; i < SECTIONS.length; i++) {
      var sec = SECTIONS[i];
      var box = el('fieldset', 'sec', grid);
      box.dataset.section = sec.id;
      var leg = el('legend', null, box);
      leg.textContent = sec.title;
      var body = el('div', 'sec-body', box);
      body.style.width = sec.cols * CELL + (sec.cols - 1) * CELL_GAP + 'px';

      for (var j = 0; j < PARAMS.length; j++) {
        var p = PARAMS[j];
        if (p.section !== sec.id) continue;
        var c = p.type === 'knob' ? createKnob(p, onChange)
          : p.type === 'switch' ? createSwitch(p, onChange)
          : createSelect(p, onChange);
        body.appendChild(c.el);
        controls[p.id] = c;
      }
    }
    return controls;
  }

  var STORE_KEY = 'voltage.patches.v1';

  /* Takes a patch from outside and gives a patch that this synthesizer can
   * use. A file can come from an older version, from a newer version, or from
   * a text editor. Therefore a value that is not in PARAMS is dropped, a value
   * that is missing gets its default, and a number that is out of its range is
   * brought back into it.
   */
  function cleanPatch(p) {
    var out = defaultPatch();
    out.name = p && typeof p.name === 'string' ? p.name.slice(0, 40) : 'Patch';
    var given = (p && p.params) || {};
    for (var k in given) {
      var spec = PARAM_BY_ID[k];
      if (!spec) continue;
      var v = given[k];
      if (spec.type === 'switch') out.params[k] = !!v;
      else if (spec.type === 'select') {
        if (spec.options.indexOf(v) >= 0) out.params[k] = v;
      } else {
        var n = Number(v);
        if (isFinite(n)) out.params[k] = clamp(n, spec.min, spec.max);
      }
    }
    return out;
  }

  // Every read and every write of the storage is guarded. A browser can block
  // the storage of a page that comes from a file, and a page that throws there
  // shows nothing at all.
  function readStore() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      var list = raw ? JSON.parse(raw) : [];
      return Object.prototype.toString.call(list) === '[object Array]' ? list : [];
    } catch (e) {
      return null;
    }
  }

  function writeStore(list) {
    try {
      window.localStorage.setItem(STORE_KEY, JSON.stringify(list));
      return true;
    } catch (e) {
      return false;
    }
  }

  /* =========================================================================
     7. The keyboard.
     ========================================================================= */

  var NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  var WHITE_STEPS = [0, 2, 4, 5, 7, 9, 11];
  // A black key stands after this white key of its octave.
  var BLACK_AFTER = { 1: 0, 3: 1, 6: 3, 8: 4, 10: 5 };
  var KB_OCTAVES = 3;
  var KB_WHITE = KB_OCTAVES * 7;

  function noteName(midi) {
    return NOTE_NAMES[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1);
  }

  /* The keyboard that the user plays with the mouse or with a finger.
   *
   * The keys hold a pointer until the button goes up, and each pointer holds
   * its own note. Thus a pointer that slides over the keys plays them one
   * after the other, a second finger plays a second note, and a pointer that
   * goes up outside the keyboard still stops its note. A note that stays on
   * because the pointer left the page is the worst defect that a keyboard on a
   * screen can have.
   */
  function buildKeyboard(root, onNoteOn, onNoteOff) {
    var base = 48;   // C3
    var wrap = el('div', 'kb', root);
    var side = el('div', 'kb-side', wrap);
    var octLabel = el('div', 'oct-label', side);
    var octRead = el('div', 'oct-read', side);
    var row = el('div', 'row', side);
    var down = el('button', 'oct-btn', row);
    var up = el('button', 'oct-btn', row);
    var keysEl = el('div', 'kb-keys', wrap);

    octLabel.textContent = 'Octave';
    down.type = 'button';
    up.type = 'button';
    down.textContent = '–';
    up.textContent = '+';
    down.setAttribute('aria-label', 'Octave down');
    up.setAttribute('aria-label', 'Octave up');
    keysEl.setAttribute('role', 'group');
    keysEl.setAttribute('aria-label', 'Keyboard');

    var keys = [];      // in the order in which they were made
    var sounding = {};  // pointer id -> midi
    var w = 100 / KB_WHITE;

    for (var o = 0; o < KB_OCTAVES; o++) {
      for (var s = 0; s < 12; s++) {
        var black = BLACK_AFTER[s] !== undefined;
        var k = el('div', 'key ' + (black ? 'black' : 'white'), keysEl);
        k.setAttribute('role', 'button');
        if (black) {
          k.style.width = w * 0.62 + '%';
          k.style.left = (o * 7 + BLACK_AFTER[s] + 1) * w - (w * 0.62) / 2 + '%';
        } else {
          k.style.width = w + '%';
          k.style.left = (o * 7 + WHITE_STEPS.indexOf(s)) * w + '%';
        }
        keys.push({ el: k, offset: o * 12 + s });
      }
    }

    function label() {
      octRead.textContent = noteName(base) + ' - ' + noteName(base + KB_OCTAVES * 12 - 1);
      for (var i = 0; i < keys.length; i++) {
        var midi = base + keys[i].offset;
        keys[i].el.dataset.midi = String(midi);
        keys[i].el.setAttribute('aria-label', noteName(midi));
      }
    }

    function keyAt(x, y) {
      var e = document.elementFromPoint(x, y);
      return e && e.classList.contains('key') ? e : null;
    }

    function show(midi, on) {
      for (var i = 0; i < keys.length; i++) {
        if (base + keys[i].offset === midi) keys[i].el.classList.toggle('on', on);
      }
    }

    function stop(pointerId) {
      var midi = sounding[pointerId];
      if (midi === undefined) return;
      delete sounding[pointerId];
      // The same note can sound under another pointer as well.
      var stillHeld = false;
      for (var id in sounding) if (sounding[id] === midi) stillHeld = true;
      if (!stillHeld) {
        show(midi, false);
        onNoteOff(midi);
      }
    }

    function play(pointerId, el2) {
      var midi = Number(el2.dataset.midi);
      if (sounding[pointerId] === midi) return;
      stop(pointerId);
      sounding[pointerId] = midi;
      show(midi, true);
      onNoteOn(midi);
    }

    function stopAll() {
      for (var id in sounding) stop(id);
    }

    keysEl.addEventListener('pointerdown', function (e) {
      var k = keyAt(e.clientX, e.clientY);
      if (!k) return;
      keysEl.setPointerCapture(e.pointerId);
      play(e.pointerId, k);
      e.preventDefault();
    });

    keysEl.addEventListener('pointermove', function (e) {
      if (sounding[e.pointerId] === undefined) return;
      var k = keyAt(e.clientX, e.clientY);
      if (k) play(e.pointerId, k);
      else stop(e.pointerId);
    });

    keysEl.addEventListener('pointerup', function (e) { stop(e.pointerId); });
    keysEl.addEventListener('pointercancel', function (e) { stop(e.pointerId); });
    window.addEventListener('blur', stopAll);

    function shift(by) {
      var next = clamp(base + by * 12, 12, 108 - KB_OCTAVES * 12);
      if (next === base) return;
      stopAll();
      base = next;
      label();
    }

    down.addEventListener('click', function () { shift(-1); });
    up.addEventListener('click', function () { shift(1); });

    label();
    return { stopAll: stopAll, shift: shift, base: function () { return base; } };
  }

  /* =========================================================================
     8. The application: power on, and the parts of the page.
     ========================================================================= */

  var plate = document.getElementById('start-plate');
  var statusEl = document.getElementById('status');
  var audio = null;
  var patch = defaultPatch();

  // One control changed. The patch is the truth; the engine follows it when
  // the synthesizer is on.
  function setParam(id, value) {
    patch.params[id] = value;
    if (audio) audio.engine.setParam(id, value);
    // The control that the user turned is already showing this value. A
    // change that comes from anywhere else needs this.
    if (controls && controls[id]) controls[id].render(value);
  }

  function getPatch() {
    var out = { name: patch.name, params: {} };
    for (var k in patch.params) out.params[k] = patch.params[k];
    return out;
  }

  // A whole patch at once, from a preset or from a file. Every control shows
  // the new value.
  function applyPatch(p) {
    var d = defaultPatch().params;
    patch = { name: p.name || 'Init', params: {} };
    for (var k in d) patch.params[k] = p.params && p.params[k] !== undefined ? p.params[k] : d[k];
    for (var id in controls) controls[id].render(patch.params[id]);
    if (audio) audio.engine.setPatch(patch, audio.ctx.currentTime);
  }

  var controls = buildPanel(document.getElementById('panel'), setParam);

  var keyboard = buildKeyboard(
    document.getElementById('keyboard'),
    function (midi) {
      // A key can be pressed before the synthesizer is on. The first press is
      // also the action that the browser waits for, and thus it powers on and
      // then sounds.
      powerOn();
      if (audio) audio.engine.noteOn(midi, 1);
    },
    function (midi) {
      if (audio) audio.engine.noteOff(midi);
    }
  );

  function powerOn() {
    if (audio) return;
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) {
      statusEl.textContent = 'no web audio';
      return;
    }
    var ctx = new Ctor();
    var engine = createEngine(ctx, ctx.destination);
    engine.setPatch(patch);
    audio = { ctx: ctx, engine: engine };

    var done = function () {
      statusEl.textContent = ctx.state === 'running' ? 'on ' + Math.round(ctx.sampleRate / 100) / 10 + ' kHz' : ctx.state;
      statusEl.classList.toggle('live', ctx.state === 'running');
    };
    var p = ctx.resume();
    if (p && p.then) p.then(done, done); else done();
    ctx.onstatechange = done;

    plate.classList.add('off');
    window.setTimeout(function () { plate.hidden = true; }, 320);
  }

  plate.addEventListener('pointerdown', powerOn);
  plate.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      powerOn();
    }
  });

  /* ---- the preset bar ---------------------------------------------------- */

  var listEl = document.getElementById('preset-list');
  var nameEl = document.getElementById('preset-name');
  var msgEl = document.getElementById('preset-msg');
  var fileEl = document.getElementById('preset-file');

  function userPatches() {
    var list = readStore();
    return list === null ? [] : list;
  }

  function refreshList(select) {
    listEl.textContent = '';
    var factory = el('optgroup', null, listEl);
    factory.label = 'Factory';
    for (var i = 0; i < FACTORY.length; i++) {
      var o = el('option', null, factory);
      o.value = 'f:' + FACTORY[i].name;
      o.textContent = FACTORY[i].name;
    }
    var mine = userPatches();
    if (mine.length) {
      var group = el('optgroup', null, listEl);
      group.label = 'Yours';
      for (var j = 0; j < mine.length; j++) {
        var u = el('option', null, group);
        u.value = 'u:' + mine[j].name;
        u.textContent = mine[j].name;
      }
    }
    if (select) listEl.value = select;
  }

  function findPatch(value) {
    var kind = value.slice(0, 2);
    var name = value.slice(2);
    var list = kind === 'f:' ? FACTORY : userPatches();
    for (var i = 0; i < list.length; i++) {
      if (list[i].name === name) return list[i];
    }
    return null;
  }

  function say(text) {
    msgEl.textContent = text || '';
  }

  listEl.addEventListener('change', function () {
    var found = findPatch(listEl.value);
    if (!found) return;
    applyPatch(cleanPatch(found));
    nameEl.value = found.name;
    say('');
  });

  document.getElementById('preset-save').addEventListener('click', function () {
    var name = (nameEl.value || '').trim() || 'Patch';
    var list = readStore();
    if (list === null) {
      say('The browser storage is not available. Use Export to keep this patch.');
      return;
    }
    var p = getPatch();
    p.name = name;
    var at = -1;
    for (var i = 0; i < list.length; i++) if (list[i].name === name) at = i;
    if (at >= 0) list[at] = p; else list.push(p);
    if (!writeStore(list)) {
      say('The browser storage refused to save. Use Export to keep this patch.');
      return;
    }
    refreshList('u:' + name);
    say('Saved "' + name + '".');
  });

  document.getElementById('preset-delete').addEventListener('click', function () {
    var value = listEl.value;
    if (value.slice(0, 2) !== 'u:') {
      say('A factory patch cannot be removed.');
      return;
    }
    var name = value.slice(2);
    var list = readStore();
    if (list === null) {
      say('The browser storage is not available.');
      return;
    }
    var left = [];
    for (var i = 0; i < list.length; i++) if (list[i].name !== name) left.push(list[i]);
    if (!writeStore(left)) {
      say('The browser storage refused to save.');
      return;
    }
    refreshList('f:Init');
    say('Removed "' + name + '".');
  });

  document.getElementById('preset-export').addEventListener('click', function () {
    var p = getPatch();
    p.name = (nameEl.value || '').trim() || p.name || 'Patch';
    var blob = new Blob([JSON.stringify(p, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = el('a', null, document.body);
    a.href = url;
    a.download = p.name.replace(/[^\w .-]+/g, '_') + '.voltage.json';
    a.click();
    a.remove();
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    say('Exported "' + p.name + '".');
  });

  document.getElementById('preset-import').addEventListener('click', function () {
    fileEl.click();
  });

  fileEl.addEventListener('change', function () {
    var file = fileEl.files && fileEl.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var clean;
      try {
        clean = cleanPatch(JSON.parse(String(reader.result)));
      } catch (e) {
        say('That file does not hold a patch.');
        return;
      }
      applyPatch(clean);
      nameEl.value = clean.name;
      say('Loaded "' + clean.name + '".');
    };
    reader.onerror = function () { say('The file could not be read.'); };
    reader.readAsText(file);
    fileEl.value = '';
  });

  refreshList('f:Init');
  nameEl.value = '';
  if (readStore() === null) {
    say('The browser storage is not available. Export and Import still work.');
  }

  var ui = {
    powerOn: powerOn,
    audioState: function () { return audio ? audio.ctx.state : 'off'; },
    engine: function () { return audio ? audio.engine : null; },
    context: function () { return audio ? audio.ctx : null; },
    getPatch: getPatch,
    setParam: setParam,
    applyPatch: applyPatch,
    controls: controls,
    keyboard: keyboard
  };

  /* =========================================================================
     6. The only global name. The application and the tests use it.
     ========================================================================= */

  window.Voltage = {
    PARAMS: PARAMS,
    defaultPatch: defaultPatch,
    createEngine: createEngine,
    FACTORY: FACTORY,
    ui: ui
  };
})();
</script>
</body>
</html>
